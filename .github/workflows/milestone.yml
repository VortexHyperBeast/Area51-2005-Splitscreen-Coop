name: Save a milestone build

# Keeps one earlier build for good: the play package of an existing run, under its own tag,
# outside the "keep the newest three builds" clean-up (that only touches coop-stage1-run*).
# Started by pushing a branch milestone/<name> whose .github/milestone.json names the run,
# commit, tag, title and notes (workflow_dispatch needs the workflow on the default branch).
on:
  push:
    branches: ['milestone/**']
  workflow_dispatch:
    inputs:
      run_id:
        description: "Actions run id of the build to keep"
        required: false
      commit:
        description: "Commit of that build (its player files are taken from it)"
        required: false
      tag:
        description: "Tag for the kept build, e.g. milestone-v0.95.26-before-enemy-health"
        required: false
      title:
        description: "Release title"
        required: false
      notes:
        description: "One paragraph about this build"
        required: false

permissions:
  contents: write
  actions: read

jobs:
  keep:
    runs-on: ubuntu-latest
    steps:
      - name: Read the milestone description
        id: m
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.run_id }}" ]; then
            echo "run_id=${{ inputs.run_id }}" >> "$GITHUB_OUTPUT"
            echo "commit=${{ inputs.commit }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            { echo "title<<EOT"; echo "${{ inputs.title }}"; echo "EOT"; echo "notes<<EOT"; echo "${{ inputs.notes }}"; echo "EOT"; } >> "$GITHUB_OUTPUT"
          else
            J="$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github.raw" "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.github/milestone.json?ref=${GITHUB_SHA}")"
            for k in run_id commit tag; do echo "$k=$(echo "$J" | jq -r ".$k")" >> "$GITHUB_OUTPUT"; done
            { echo "title<<EOT"; echo "$J" | jq -r .title; echo "EOT"; echo "notes<<EOT"; echo "$J" | jq -r .notes; echo "EOT"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the build's commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.m.outputs.commit }}

      - name: Download the play build of that run
        uses: actions/download-artifact@v4
        with:
          name: A51-coop-stage1-win-x64
          path: play
          run-id: ${{ steps.m.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download its debug symbols
        uses: actions/download-artifact@v4
        with:
          name: A51-coop-stage1-win-x64-pdb
          path: pdb
          run-id: ${{ steps.m.outputs.run_id }}
          github-token: ${{ github.token }}
        continue-on-error: true

      - name: Assemble and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.m.outputs.tag }}
          TITLE: ${{ steps.m.outputs.title }}
          NOTES: ${{ steps.m.outputs.notes }}
          COMMIT: ${{ steps.m.outputs.commit }}
          RUN_ID: ${{ steps.m.outputs.run_id }}
        run: |
          set -euo pipefail
          NAME="Area51-Coop-$TAG"
          mkdir -p "dist/$NAME"
          cp -a play/. "dist/$NAME/"
          cp tools/coop-play/Setup-Assets.ps1 tools/coop-play/PLAY-COOP-2-PLAYERS.cmd tools/coop-play/PLAY-SINGLE-PLAYER.cmd tools/coop-play/README.txt "dist/$NAME/"
          cp -r tools/coop-play/SCREENS "dist/$NAME/"
          for f in "dist/$NAME"/*.cmd "dist/$NAME"/*.ps1 "dist/$NAME"/README.txt; do sed -i 's/\r$//; s/$/\r/' "$f"; done
          ZIP="$NAME.zip"
          (cd dist && zip -q -r -9 "../$ZIP" "$NAME")
          ls -l "$ZIP"
          PDB=()
          if [ -f pdb/A51.pdb ]; then PDB=("pdb/A51.pdb#A51-$TAG.pdb (debug symbols)"); fi
          printf '%s\n\nBuilt from commit %s (Actions run %s). The zip contains no game data.\n' "$NOTES" "$COMMIT" "$RUN_ID" > notes.md
          # Kept on the branch "milestones" (this token may not create releases from here):
          # milestones/<tag>/ holds the zip, the debug symbols and a note.
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898283+github-actions[bot]@users.noreply.github.com"
          rm -rf ms && mkdir ms && cd ms
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin milestones 2>/dev/null; then git checkout -q -b milestones FETCH_HEAD; else git checkout -q --orphan milestones; fi
          mkdir -p "$TAG"
          cp "../$ZIP" "$TAG/"
          if [ -f ../pdb/A51.pdb ]; then cp ../pdb/A51.pdb "$TAG/A51-$TAG.pdb"; fi
          { echo "$TITLE"; echo; cat ../notes.md; } > "$TAG/ABOUT.txt"
          git add "$TAG"
          git commit -q -m "$TITLE"
          git push -q origin HEAD:milestones
          echo "kept on branch milestones: $TAG/$ZIP"
